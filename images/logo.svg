<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .eyebrow { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 20px; letter-spacing: 7px; fill: #5B6142; }
      .wordmark { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 66px; font-weight: 700; letter-spacing: 2px; fill: #4A4A3D; }
      .tagline { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 21px; font-style: italic; fill: #6B7350; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- base -->
  <circle cx="300" cy="300" r="286" fill="#F8F4EA"/>

  <!-- outer rings, like a woven label edge -->
  <circle cx="300" cy="300" r="280" fill="none" stroke="#9CAA7C" stroke-width="3"/>
  <circle cx="300" cy="300" r="266" fill="none" stroke="#B99B5B" stroke-width="1"/>

  <!-- leaf sprigs flanking the eyebrow -->
  <g stroke="#8A9468" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M170 168 L215 158"/>
    <ellipse cx="197" cy="160" rx="9" ry="4.5" transform="rotate(-14 197 160)" fill="#9CAA7C" stroke="none"/>
    <ellipse cx="178" cy="166" rx="7" ry="3.5" transform="rotate(-14 178 166)" fill="#9CAA7C" stroke="none"/>

    <path d="M430 168 L385 158"/>
    <ellipse cx="403" cy="160" rx="9" ry="4.5" transform="rotate(14 403 160)" fill="#9CAA7C" stroke="none"/>
    <ellipse cx="422" cy="166" rx="7" ry="3.5" transform="rotate(14 422 166)" fill="#9CAA7C" stroke="none"/>
  </g>

  <!-- eyebrow -->
  <text x="300" y="176" text-anchor="middle" class="eyebrow">MAISON</text>

  <!-- wordmark -->
  <text x="300" y="288" text-anchor="middle" class="wordmark">LA TROUSSE</text>

  <!-- divider -->
  <line x1="205" y1="322" x2="278" y2="322" stroke="#B99B5B" stroke-width="1.3"/>
  <rect x="295" y="317" width="10" height="10" fill="#B99B5B" transform="rotate(45 300 322)"/>
  <line x1="322" y1="322" x2="395" y2="322" stroke="#B99B5B" stroke-width="1.3"/>

  <!-- tagline -->
  <text x="300" y="366" text-anchor="middle" class="tagline">atelier de beauté</text>

  <!-- pouch icon -->
  <g transform="translate(300 452)">
    <path d="M-52 4 C-52 -22 -30 -34 0 -34 C30 -34 52 -22 52 4 C52 26 30 40 0 40 C-30 40 -52 26 -52 4 Z"
          fill="none" stroke="#5B6142" stroke-width="3"/>
    <path d="M-38 -22 C-20 -30 20 -30 38 -22" fill="none" stroke="#5B6142" stroke-width="2.2" stroke-dasharray="1 7" stroke-linecap="round"/>
    <rect x="-6" y="-38" width="12" height="10" rx="4" fill="#5B6142"/>
  </g>
</svg>
